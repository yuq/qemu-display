[package]
name = "qemu-display"
version = "0.1.0"
authors = ["Marc-André Lureau <marcandre.lureau@redhat.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
qmp = ["dep:qapi", "dep:base64"]

[dependencies]
tracing.workspace = true
zbus.workspace = true
cfg-if = "1.0"
derivative = "2.2.0"
zvariant = { version = "4", features = ["serde_bytes"] }
libc = "0.2.155"
enumflags2 = { version = "0.7", features = ["serde"] }
serde = { version = "1.0.202", features = ["derive"] }
serde_repr = "0.1.19"
serde_bytes = "0.11.14"
futures-util = { version = "0.3.30", features = ["async-await-macro"] }
once_cell = "1.19"
futures = "0.3.30"
usbredirhost = "0.2"
async-broadcast = "0.7"
async-trait = "0.1.80"
async-lock = "3.3.0"
qapi = { version = "0.14", features = ["qmp"], optional = true }
base64 = { version = "0.22.1", optional = true }

[target.'cfg(windows)'.dependencies]
uds_windows = "1.1.0"
windows = { version = "0.43.0", features = ["Win32_Networking_WinSock", "Win32_Foundation", "Win32_System_IO", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
async-std = { version = "1.12.0", features = ["attributes"] }
tracing-subscriber = { version = "0.3.18", features = ["env-filter" , "fmt"], default-features = false }

[dev-dependencies]
pixman-sys.workspace = true
async-std = { version = "1.12", features = ["attributes"] }
tracing-subscriber = "0.3"
rand = "0.8"

[[example]]
name = 'win32-test'
required-features = ["qmp"]
